<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>A Rakhi for you</title>
<meta property="og:title" content="A Rakhi for you">
<meta property="og:description" content="Open on your phone and point the camera at your wrist.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf3e7;
    --card: #fffaf1;
    --ink: #3a1f1a;
    --accent: #c73b2b;
    --gold: #cf9d3f;
    --muted: #8a7062;
    --line: #ecdcc4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: var(--ink);
    font-family: 'Martian Mono', monospace;
    height: 100%;
    overflow: hidden;
  }

  /* ---- intro screen ---- */
  #intro {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px;
    z-index: 20;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  #introImg {
    width: 220px;
    max-width: 70vw;
    height: auto;
    margin-bottom: 18px;
    filter: drop-shadow(0 6px 14px rgba(58,31,26,0.12));
  }
  h1 {
    font-size: 19px;
    font-weight: 500;
    line-height: 1.5;
    margin: 0 0 6px;
  }
  #fromLine {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 4px;
  }
  #noteLine {
    font-size: 13px;
    color: var(--ink);
    line-height: 1.6;
    max-width: 360px;
    margin: 12px 0 30px;
  }
  .btn {
    display: inline-block;
    font-family: 'Martian Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #fffaf1;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 14px 28px;
    cursor: pointer;
  }
  .btn:active { transform: scale(0.98); }
  .privacy-note {
    font-size: 10px;
    color: var(--muted);
    line-height: 1.6;
    max-width: 300px;
    margin-top: 22px;
  }
  #errorBox {
    display: none;
    font-size: 12px;
    color: var(--accent);
    max-width: 300px;
    line-height: 1.6;
    margin-top: 18px;
  }
  #errorBox.show { display: block; }

  /* ---- AR view ---- */
  #arView { position: fixed; inset: 0; display: none; }
  #arView.show { display: block; }
  video { display: none; }
  canvas#stage {
    position: absolute;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
  }

  #hint {
    position: absolute;
    left: 50%;
    bottom: 110px;
    transform: translateX(-50%);
    background: rgba(58,31,26,0.55);
    color: #fffaf1;
    font-size: 12px;
    padding: 10px 16px;
    border-radius: 999px;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
    white-space: nowrap;
    z-index: 5;
  }
  #hint.show { opacity: 1; }

  #adjustHint {
    position: absolute;
    left: 50%;
    bottom: 110px;
    transform: translateX(-50%);
    background: rgba(58,31,26,0.55);
    color: #fffaf1;
    font-size: 11px;
    padding: 8px 14px;
    border-radius: 999px;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
    white-space: nowrap;
    z-index: 5;
  }
  #adjustHint.show { opacity: 1; }

  /* ---- scan frame, shown before the first hand is confirmed in place ---- */
  #scanFrame {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 68vw;
    max-width: 340px;
    height: 34vh;
    max-height: 220px;
    border-radius: 22px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
    z-index: 6;
  }
  #scanFrame.show { opacity: 1; }
  #scanFrame .bracket {
    position: absolute;
    width: 26px;
    height: 26px;
    border: 3px solid rgba(255,250,241,0.85);
    transition: border-color 0.3s ease;
  }
  #scanFrame.confirmed .bracket { border-color: #f2c14e; }
  #scanFrame .bracket.tl { top: -3px; left: -3px; border-right: none; border-bottom: none; border-top-left-radius: 16px; }
  #scanFrame .bracket.tr { top: -3px; right: -3px; border-left: none; border-bottom: none; border-top-right-radius: 16px; }
  #scanFrame .bracket.bl { bottom: -3px; left: -3px; border-right: none; border-top: none; border-bottom-left-radius: 16px; }
  #scanFrame .bracket.br { bottom: -3px; right: -3px; border-left: none; border-top: none; border-bottom-right-radius: 16px; }
  #scanFrameText {
    position: absolute;
    left: 50%;
    top: calc(50% + 150px);
    transform: translateX(-50%);
    color: #fffaf1;
    font-size: 12px;
    text-align: center;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    max-width: 260px;
    line-height: 1.6;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
    z-index: 6;
  }
  #scanFrameText.show { opacity: 1; }

  /* ---- festive floating overlay ---- */
  #festiveHeading {
    position: absolute;
    top: max(18px, env(safe-area-inset-top));
    left: 0;
    right: 0;
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: #fffaf1;
    text-shadow: 0 2px 10px rgba(0,0,0,0.45);
    opacity: 0;
    transition: opacity 1.2s ease;
    z-index: 4;
    pointer-events: none;
    animation: floatY 5s ease-in-out infinite;
  }
  #festiveHeading.show { opacity: 0.8; }
  @keyframes floatY {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(4px); }
  }

  .tassel {
    position: absolute;
    top: 0;
    width: 34px;
    opacity: 0;
    transition: opacity 1.4s ease;
    z-index: 4;
    pointer-events: none;
  }
  .tassel.show { opacity: 0.55; }
  #tasselLeft { left: 14px; }
  #tasselRight { right: 14px; }

  #captionBar {
    position: absolute;
    top: max(56px, calc(env(safe-area-inset-top) + 40px));
    left: 16px;
    right: 16px;
    text-align: center;
    padding: 0 14px;
    font-size: 12px;
    line-height: 1.6;
    color: #fffaf1;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    z-index: 5;
  }
  #captionBar .from { color: #f7d878; font-weight: 700; }

  #bottomBar {
    position: absolute;
    bottom: max(24px, env(safe-area-inset-bottom));
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    z-index: 5;
  }
  #captureBtn {
    background: #fffaf1;
    color: var(--ink);
    border: none;
    border-radius: 999px;
    padding: 14px 26px;
    font-family: 'Martian Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
  }

  #flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 30;
  }
  #flash.on { opacity: 0.8; transition: opacity 0.08s ease; }
  #flash.off { opacity: 0; transition: opacity 0.5s ease; }

  #loading {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--muted);
    z-index: 25;
  }
  #loading.show { display: flex; }
</style>
</head>
<body>

<div id="intro">
  <div class="eyebrow">Raksha Bandhan</div>
  <img id="introImg" src="" alt="Your Rakhi">
  <h1>A Rakhi for you</h1>
  <div id="fromLine"></div>
  <div id="noteLine"></div>
  <button class="btn" id="startBtn">Open camera</button>
  <div class="privacy-note">This runs entirely on your phone. Your camera feed is never uploaded, recorded, or sent anywhere.</div>
  <div id="errorBox"></div>
</div>

<div id="loading">Loading camera…</div>

<div id="arView">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="stage"></canvas>

  <svg id="tasselLeft" class="tassel" viewBox="0 0 40 90">
    <path d="M6 0 C6 0 4 10 8 16 C4 20 4 30 8 34 L8 60 C8 68 20 68 20 60 L20 34 C24 30 24 20 20 16 C24 10 22 0 22 0 Z" fill="#f2c14e"/>
    <circle cx="14" cy="70" r="6" fill="#c73b2b"/>
    <path d="M14 76 L8 90 L20 90 Z" fill="#f2a33c"/>
  </svg>
  <svg id="tasselRight" class="tassel" viewBox="0 0 40 90">
    <path d="M6 0 C6 0 4 10 8 16 C4 20 4 30 8 34 L8 60 C8 68 20 68 20 60 L20 34 C24 30 24 20 20 16 C24 10 22 0 22 0 Z" fill="#f2c14e"/>
    <circle cx="14" cy="70" r="6" fill="#5c7a52"/>
    <path d="M14 76 L8 90 L20 90 Z" fill="#f2a33c"/>
  </svg>

  <div id="festiveHeading">✨ Happy Raksha Bandhan ✨</div>
  <div id="captionBar" style="display:none;"></div>

  <div id="scanFrame">
    <div class="bracket tl"></div>
    <div class="bracket tr"></div>
    <div class="bracket bl"></div>
    <div class="bracket br"></div>
  </div>
  <div id="scanFrameText">Hold your wrist inside the frame</div>

  <div id="hint">Point your camera at your wrist ✨</div>
  <div id="adjustHint">Drag to move · pinch to resize</div>
  <div id="bottomBar" style="display:none;">
    <button id="captureBtn">Save this moment</button>
  </div>
</div>

<div id="flash"></div>

<script>
  const DESIGNS = {
    classic: { file: 'assets/rakhi-classic.svg', label: 'Classic Red & Gold' },
    minimal: { file: 'assets/rakhi-minimal.svg', label: 'Minimal Blush' },
    floral:  { file: 'assets/rakhi-floral.svg', label: 'Floral Green & Gold' }
  };

  const params = new URLSearchParams(window.location.search);
  const designId = DESIGNS[params.get('d')] ? params.get('d') : 'classic';
  const design = DESIGNS[designId];
  const fromName = (params.get('n') || '').slice(0, 40);
  const note = (params.get('m') || '').slice(0, 140);

  document.getElementById('introImg').src = design.file;
  document.getElementById('fromLine').textContent = fromName ? ('from ' + fromName) : '';
  document.getElementById('noteLine').textContent = note;

  if (fromName || note) {
    const cap = document.getElementById('captionBar');
    cap.innerHTML = (fromName ? '<span class="from">' + fromName + '</span><br>' : '') + note;
  }

  const startBtn = document.getElementById('startBtn');
  const errorBox = document.getElementById('errorBox');
  const loading = document.getElementById('loading');
  const intro = document.getElementById('intro');
  const arView = document.getElementById('arView');
  const video = document.getElementById('video');
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const captionBar = document.getElementById('captionBar');
  const bottomBar = document.getElementById('bottomBar');
  const captureBtn = document.getElementById('captureBtn');
  const flash = document.getElementById('flash');
  const scanFrame = document.getElementById('scanFrame');
  const scanFrameText = document.getElementById('scanFrameText');
  const adjustHint = document.getElementById('adjustHint');

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('show');
    loading.classList.remove('show');
  }

  const rakhiImg = new Image();
  rakhiImg.src = design.file;
  const tyingHandImg = new Image();
  tyingHandImg.src = 'assets/tying-hand.svg';

  let handLandmarker = null;
  let lastVideoTime = -1;

  // --- tracking smoothing + presence state ---
  const SMOOTH_ALPHA = 0.35;   // higher = snappier/more jittery, lower = smoother/more lag
  const GRACE_MS = 350;        // keep drawing at the last known spot through brief tracking dropouts
  const HINT_MS = 900;         // show the "point at your wrist" hint after this much continuous loss
  const SUSTAIN_MS = 350;      // require this much continuous detection before starting the tie-in
  const CONFIRM_MS = 650;      // "got it" pause in the scan frame before the hand animation begins

  // roughly matches #scanFrame's visual position (68vw × 34vh, centered) — the wrist landmark
  // must land in here before we treat the hand as "placed"
  const FRAME_BOUNDS = { x0: 0.16, x1: 0.84, y0: 0.33, y1: 0.67 };

  let smooth = null;           // { x, y, angle, width, height } — smoothed wrist transform
  let lastLandmarks = null;
  let lastHandedLabel = null;
  let lastSeenAt = 0;
  let inFrameSince = null;

  // --- tie-in animation state ---
  const SIDE_FLIPPED = false;  // flip if the entry side reads backwards in testing
  const ENTER_MS = 1700, HOLD_MS = 550, EXIT_MS = 1100; // slow and deliberate, per reference
  const TYING_TOTAL_MS = ENTER_MS + HOLD_MS + EXIT_MS;
  let arState = 'idle';        // 'idle' -> 'confirmed' -> 'tying' -> 'steady'
  let confirmedStartAt = null;
  let tyingStartAt = null;
  let tyingSide = 'left';

  // --- manual drag/pinch correction, enabled once the Rakhi is placed ---
  let manualOffset = { x: 0, y: 0 };
  let manualScale = 1;
  let adjustHintShown = false;

  function revealChrome() {
    if (fromName || note) captionBar.style.display = 'block';
    bottomBar.style.display = 'flex';
  }

  function inFrame(landmarks) {
    const x = landmarks[0].x, y = landmarks[0].y;
    return x > FRAME_BOUNDS.x0 && x < FRAME_BOUNDS.x1 && y > FRAME_BOUNDS.y0 && y < FRAME_BOUNDS.y1;
  }

  function lerp(a, b, t) { return a + (b - a) * t; }
  function lerpAngle(a, b, t) {
    const diff = ((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
    return a + diff * t;
  }
  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }
  function deriveSide(handedLabel) {
    // MediaPipe's handedness is read directly off the (unmirrored, rear-camera) frame.
    let side = handedLabel === 'Left' ? 'right' : 'left';
    if (SIDE_FLIPPED) side = side === 'left' ? 'right' : 'left';
    return side;
  }

  async function loadModel() {
    const { HandLandmarker, FilesetResolver } = await import(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14'
    );
    const vision = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );
    const modelUrl = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
    try {
      return await HandLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: modelUrl, delegate: 'GPU' },
        runningMode: 'VIDEO',
        numHands: 1
      });
    } catch (e) {
      return await HandLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: modelUrl, delegate: 'CPU' },
        runningMode: 'VIDEO',
        numHands: 1
      });
    }
  }

  async function start() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showError('This browser can\'t access the camera. Try opening this link on your phone in Chrome or Safari.');
      return;
    }
    loading.classList.add('show');
    errorBox.classList.remove('show');
    try {
      const [stream, model] = await Promise.all([
        navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        }),
        handLandmarker ? Promise.resolve(handLandmarker) : loadModel()
      ]);
      handLandmarker = model;
      video.srcObject = stream;
      await video.play();
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      intro.style.display = 'none';
      loading.classList.remove('show');
      arView.classList.add('show');
      requestAnimationFrame(() => {
        document.getElementById('festiveHeading').classList.add('show');
        document.getElementById('tasselLeft').classList.add('show');
        document.getElementById('tasselRight').classList.add('show');
        scanFrame.classList.add('show');
        scanFrameText.classList.add('show');
      });
      // safety fallback: if a hand is never detected, still surface the capture button
      setTimeout(revealChrome, 6000);

      requestAnimationFrame(loop);
    } catch (err) {
      let msg = 'Couldn\'t open the camera. ';
      if (err.name === 'NotAllowedError') msg += 'Camera permission was denied — allow camera access and try again.';
      else if (err.name === 'NotFoundError') msg += 'No camera was found on this device.';
      else msg += 'Please try again.';
      showError(msg);
    }
  }

  function loop() {
    requestAnimationFrame(loop);
    if (video.readyState < 2) return;

    if (video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      const result = handLandmarker.detectForVideo(video, performance.now());
      const landmarks = result && result.landmarks && result.landmarks[0] ? result.landmarks[0] : null;

      if (landmarks) {
        lastLandmarks = landmarks;
        lastSeenAt = performance.now();

        const handedArr = (result.handednesses && result.handednesses[0])
          || (result.handedness && result.handedness[0]) || null;
        const label = handedArr && handedArr[0] && (handedArr[0].categoryName || handedArr[0].display_name);
        if (label) lastHandedLabel = label;
      }
      // a miss doesn't clear lastLandmarks immediately — render() decides via the grace window,
      // so a single dropped frame doesn't make the Rakhi flicker off
    }

    render();
  }

  function render() {
    const now = performance.now();
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const sinceSeen = now - lastSeenAt;
    const present = lastLandmarks && sinceSeen <= GRACE_MS;

    if (present) {
      hint.classList.remove('show');
      smoothToward(computeTransform(lastLandmarks));
      const withinFrame = inFrame(lastLandmarks);

      if (arState === 'idle') {
        if (withinFrame) {
          if (inFrameSince === null) inFrameSince = now;
          if (now - inFrameSince > SUSTAIN_MS) {
            arState = 'confirmed';
            confirmedStartAt = now;
            scanFrame.classList.add('confirmed');
            scanFrameText.textContent = 'Got it ✨';
          }
        } else {
          inFrameSince = null;
        }
      } else if (arState === 'confirmed') {
        if (!withinFrame) {
          arState = 'idle';
          inFrameSince = null;
          scanFrame.classList.remove('confirmed');
          scanFrameText.textContent = 'Hold your wrist inside the frame';
        } else if (now - confirmedStartAt > CONFIRM_MS) {
          arState = 'tying';
          tyingStartAt = now;
          tyingSide = deriveSide(lastHandedLabel);
          scanFrame.classList.remove('show', 'confirmed');
          scanFrameText.classList.remove('show');
        }
      }
    } else {
      inFrameSince = null;
      if (arState === 'confirmed') {
        arState = 'idle';
        scanFrame.classList.remove('confirmed');
        scanFrameText.textContent = 'Hold your wrist inside the frame';
      }
      if (sinceSeen > HINT_MS) hint.classList.add('show');
    }

    if (!smooth) return;

    if (arState === 'tying') {
      drawTyingAnimation(now);
    } else if (arState === 'steady') {
      drawRakhiAt(applyManualAdjust(smooth), 1);
    }
    updateAndDrawParticles();
  }

  function applyManualAdjust(t) {
    return {
      x: t.x + manualOffset.x,
      y: t.y + manualOffset.y,
      angle: t.angle,
      width: t.width * manualScale,
      height: t.height * manualScale
    };
  }

  function computeTransform(landmarks) {
    const w = canvas.width, h = canvas.height;
    const wrist = { x: landmarks[0].x * w, y: landmarks[0].y * h };
    const midMcp = { x: landmarks[9].x * w, y: landmarks[9].y * h };
    const indexMcp = { x: landmarks[5].x * w, y: landmarks[5].y * h };
    const pinkyMcp = { x: landmarks[17].x * w, y: landmarks[17].y * h };

    // direction pointing from the hand out along the forearm
    const dx = wrist.x - midMcp.x;
    const dy = wrist.y - midMcp.y;
    const forearmLen = Math.hypot(dx, dy) || 1;
    const dirX = dx / forearmLen, dirY = dy / forearmLen;

    // hand span (knuckle row) defines how wide the band should be — the wrist itself is
    // narrower than the knuckle row, so this stays well under 1x, not over it
    const span = Math.hypot(pinkyMcp.x - indexMcp.x, pinkyMcp.y - indexMcp.y);
    const WRIST_WIDTH_RATIO = 1.1; // tune this one number if the band still overhangs the arm
    const bandWidth = Math.max(span * WRIST_WIDTH_RATIO, 40);
    const bandHeight = bandWidth * (rakhiImg.naturalHeight / rakhiImg.naturalWidth);

    // anchor point sits a bit past the wrist, onto the forearm
    const anchorX = wrist.x + dirX * forearmLen * 0.45;
    const anchorY = wrist.y + dirY * forearmLen * 0.45;
    const angle = Math.atan2(dirY, dirX) + Math.PI / 2;

    return { x: anchorX, y: anchorY, angle, width: bandWidth, height: bandHeight };
  }

  function smoothToward(target) {
    if (!smooth) { smooth = { ...target }; return; }
    const a = SMOOTH_ALPHA;
    smooth.x += (target.x - smooth.x) * a;
    smooth.y += (target.y - smooth.y) * a;
    smooth.width += (target.width - smooth.width) * a;
    smooth.height += (target.height - smooth.height) * a;
    smooth.angle = lerpAngle(smooth.angle, target.angle, a);
  }

  function drawRakhiAt(t, alpha) {
    if (!rakhiImg.complete || rakhiImg.naturalWidth === 0 || alpha <= 0) return;
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(t.angle);
    ctx.globalAlpha = 0.96 * alpha;
    ctx.drawImage(rakhiImg, -t.width / 2, -t.height / 2, t.width, t.height);
    ctx.restore();
  }

  // where the illustration's fingers pinch, as a fraction of its own width/height
  const HAND_PINCH_FX = 0.819, HAND_PINCH_FY = 0.423;

  function drawTyingHandAt(point, handW, handH, mirrored, alpha) {
    if (!tyingHandImg.complete || tyingHandImg.naturalWidth === 0 || alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(point.x, point.y);
    if (mirrored) ctx.scale(-1, 1);
    ctx.drawImage(tyingHandImg, -HAND_PINCH_FX * handW, -HAND_PINCH_FY * handH, handW, handH);
    ctx.restore();
  }

  // simple placeholder celebration burst (flowers/sparks) — swap PARTICLE_COLORS or the
  // draw shape in updateAndDrawParticles() once real illustrations replace this
  let particles = [];
  const PARTICLE_COLORS = ['#c73b2b', '#f2c14e', '#f2a33c', '#5c7a52', '#fbf6ee'];

  function spawnCelebration(x, y) {
    const n = 28;
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 * i) / n + (Math.random() - 0.5) * 0.4;
      const speed = 2.4 + Math.random() * 2.8;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1.8, // slight upward bias — reads as a small burst
        life: 1,
        decay: 0.011 + Math.random() * 0.009,
        size: 4 + Math.random() * 5,
        color: PARTICLE_COLORS[i % PARTICLE_COLORS.length]
      });
    }
  }

  function updateAndDrawParticles() {
    if (!particles.length) return;
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.06; // gravity
      p.life -= p.decay;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.size, p.size * 0.7, Math.atan2(p.vy, p.vx), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawTyingAnimation(now) {
    const t = now - tyingStartAt;
    if (t >= TYING_TOTAL_MS) {
      arState = 'steady';
      revealChrome();
      spawnCelebration(smooth.x, smooth.y);
      drawRakhiAt(smooth, 1);
      if (!adjustHintShown) {
        adjustHintShown = true;
        adjustHint.classList.add('show');
        setTimeout(() => adjustHint.classList.remove('show'), 3200);
      }
      return;
    }

    const w = canvas.width, h = canvas.height;
    // the wrist keeps being tracked live throughout, so the hand always converges on
    // wherever it currently is rather than a point captured back at animation start
    const anchorPoint = { x: smooth.x, y: smooth.y };
    const handW = Math.max(smooth.width * 2.8, 260);
    const handH = handW * (tyingHandImg.naturalHeight / tyingHandImg.naturalWidth);
    const mirrored = tyingSide === 'right';
    // enters from a steep top-corner diagonal, not a flat horizontal reach — ok to clip off-canvas
    const startPoint = {
      x: tyingSide === 'left' ? -handW * 0.5 : w + handW * 0.5,
      y: -handH * 0.45
    };

    let handPoint, rakhiPoint, handAlpha;

    if (t < ENTER_MS) {
      // carries the Rakhi in, pinched between its fingers
      const p = easeInOutCubic(t / ENTER_MS);
      handPoint = { x: lerp(startPoint.x, anchorPoint.x, p), y: lerp(startPoint.y, anchorPoint.y, p) };
      rakhiPoint = handPoint;
      handAlpha = Math.min(1, t / 250);
    } else if (t < ENTER_MS + HOLD_MS) {
      // presses it into place
      handPoint = anchorPoint;
      rakhiPoint = anchorPoint;
      handAlpha = 1;
    } else {
      // lets go and retreats the way it came; the Rakhi stays put, tracking the live wrist
      const p = easeInOutCubic((t - ENTER_MS - HOLD_MS) / EXIT_MS);
      handPoint = { x: lerp(anchorPoint.x, startPoint.x, p), y: lerp(anchorPoint.y, startPoint.y, p) };
      rakhiPoint = anchorPoint;
      handAlpha = 1 - p;
    }

    drawRakhiAt({ ...smooth, x: rakhiPoint.x, y: rakhiPoint.y }, 1);
    drawTyingHandAt(handPoint, handW, handH, mirrored, handAlpha);
  }

  captureBtn.addEventListener('click', () => {
    flash.classList.add('on');
    setTimeout(() => { flash.classList.remove('on'); flash.classList.add('off'); }, 90);

    canvas.toBlob(async (blob) => {
      const file = new File([blob], 'ar-rakhi.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: 'My AR Rakhi' });
          return;
        } catch (e) { /* user cancelled — fall through to download */ }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ar-rakhi.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }, 'image/png');
  });

  startBtn.addEventListener('click', start);

  // --- manual drag-to-move / pinch-to-resize correction, once the Rakhi is placed ---
  let touchMode = null; // 'drag' | 'pinch' | null
  let dragLast = null;
  let pinchStartDist = null;
  let pinchStartScale = 1;

  function cssToCanvasScale() {
    const rect = canvas.getBoundingClientRect();
    return Math.max(canvas.width / rect.width, canvas.height / rect.height);
  }
  function touchDist(a, b) {
    return Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
  }
  // the canvas covers the full screen, so incidental contact (a thumb resting on the edge
  // while holding the phone) must NOT be able to grab-and-pin the Rakhi — only a touch that
  // actually starts near its current on-screen position may begin a drag
  function clientToCanvasPoint(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const s = cssToCanvasScale();
    const offsetX = (rect.width - canvas.width / s) / 2;
    const offsetY = (rect.height - canvas.height / s) / 2;
    return { x: (clientX - rect.left - offsetX) * s, y: (clientY - rect.top - offsetY) * s };
  }
  function nearRakhi(canvasX, canvasY) {
    if (!smooth) return false;
    const rx = smooth.x + manualOffset.x, ry = smooth.y + manualOffset.y;
    const radius = Math.max(smooth.width, smooth.height) * 0.8 + 50;
    return Math.hypot(canvasX - rx, canvasY - ry) <= radius;
  }

  canvas.addEventListener('touchstart', (e) => {
    if (arState !== 'steady') return;
    if (e.touches.length === 1) {
      const p = clientToCanvasPoint(e.touches[0].clientX, e.touches[0].clientY);
      if (!nearRakhi(p.x, p.y)) return; // not touching the Rakhi — ignore, let it pass through
      touchMode = 'drag';
      dragLast = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      e.preventDefault();
    } else if (e.touches.length === 2) {
      const mid = clientToCanvasPoint(
        (e.touches[0].clientX + e.touches[1].clientX) / 2,
        (e.touches[0].clientY + e.touches[1].clientY) / 2
      );
      if (!nearRakhi(mid.x, mid.y)) return;
      touchMode = 'pinch';
      pinchStartDist = touchDist(e.touches[0], e.touches[1]);
      pinchStartScale = manualScale;
      e.preventDefault();
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    if (arState !== 'steady' || !touchMode) return;
    const s = cssToCanvasScale();
    if (touchMode === 'drag' && e.touches.length === 1) {
      const t = e.touches[0];
      manualOffset.x += (t.clientX - dragLast.x) * s;
      manualOffset.y += (t.clientY - dragLast.y) * s;
      dragLast = { x: t.clientX, y: t.clientY };
    } else if (touchMode === 'pinch' && e.touches.length === 2) {
      const dist = touchDist(e.touches[0], e.touches[1]);
      manualScale = Math.min(2.5, Math.max(0.4, pinchStartScale * (dist / pinchStartDist)));
    }
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) touchMode = null;
    else if (e.touches.length === 1) {
      touchMode = 'drag';
      dragLast = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
  });
</script>
</body>
