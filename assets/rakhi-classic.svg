<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 170" width="340" height="170">
  <defs>
    <radialGradient id="medallionFill" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#e8543f"/>
      <stop offset="100%" stop-color="#c73b2b"/>
    </radialGradient>
  </defs>

  <!-- thread band -->
  <path d="M 8 78 C 60 40, 120 100, 170 68 C 220 36, 280 96, 332 62"
        fill="none" stroke="#c73b2b" stroke-width="9" stroke-linecap="round"/>

  <!-- left tassel -->
  <g stroke="#e8b23d" stroke-width="3" stroke-linecap="round">
    <line x1="20" y1="82" x2="12" y2="118"/>
    <line x1="27" y1="84" x2="22" y2="122"/>
    <line x1="34" y1="83" x2="34" y2="120"/>
    <line x1="41" y1="80" x2="46" y2="116"/>
  </g>
  <!-- knot where the tassel ties on -->
  <circle cx="26" cy="82" r="8" fill="#f2c14e"/>

  <!-- right tassel -->
  <g stroke="#e8b23d" stroke-width="3" stroke-linecap="round">
    <line x1="298" y1="72" x2="292" y2="110"/>
    <line x1="306" y1="70" x2="304" y2="108"/>
    <line x1="314" y1="69" x2="316" y2="106"/>
    <line x1="321" y1="70" x2="326" y2="104"/>
  </g>
  <circle cx="310" cy="70" r="8" fill="#f2c14e"/>

  <!-- center medallion -->
  <circle cx="170" cy="68" r="37" fill="#f2c14e"/>
  <circle cx="170" cy="68" r="31" fill="url(#medallionFill)"/>
  <g fill="#f7d878">
    <circle cx="170" cy="46" r="3"/>
    <circle cx="188.6" cy="57" r="3"/>
    <circle cx="188.6" cy="79" r="3"/>
    <circle cx="170" cy="90" r="3"/>
    <circle cx="151.4" cy="79" r="3"/>
    <circle cx="151.4" cy="57" r="3"/>
  </g>
  <path d="M 170 56 L 175 66 L 170 76 L 165 66 Z" fill="#fff3d6"/>
</svg>
