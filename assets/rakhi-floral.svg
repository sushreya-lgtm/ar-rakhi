<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 170" width="340" height="170">
  <!-- thread band -->
  <path d="M 12 80 C 66 46, 122 106, 170 74 C 218 42, 274 102, 328 68"
        fill="none" stroke="#5c7a52" stroke-width="7" stroke-linecap="round"/>

  <!-- knot -->
  <circle cx="14" cy="80" r="7" fill="#d9b65a"/>
  <circle cx="326" cy="70" r="7" fill="#d9b65a"/>

  <!-- left leaf sprig -->
  <path d="M 34 78 C 20 68, 10 74, 6 88" fill="none" stroke="#5c7a52" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="6" cy="84" rx="7" ry="4" fill="#7fa06d" transform="rotate(-30 6 84)"/>

  <!-- right leaf sprig -->
  <path d="M 306 70 C 320 60, 330 66, 334 80" fill="none" stroke="#5c7a52" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="334" cy="76" rx="7" ry="4" fill="#7fa06d" transform="rotate(30 334 76)"/>

  <!-- marigold cluster (center) -->
  <g transform="translate(170 74)">
    <g fill="#f2a33c">
      <circle cx="0" cy="-16" r="8"/>
      <circle cx="14" cy="-8" r="8"/>
      <circle cx="14" cy="8" r="8"/>
      <circle cx="0" cy="16" r="8"/>
      <circle cx="-14" cy="8" r="8"/>
      <circle cx="-14" cy="-8" r="8"/>
    </g>
    <circle cx="0" cy="0" r="10" fill="#e8862c"/>
    <!-- jasmine buds -->
    <circle cx="-26" cy="-2" r="4.5" fill="#fbf6ee"/>
    <circle cx="26" cy="4" r="4.5" fill="#fbf6ee"/>
    <circle cx="6" cy="-26" r="4" fill="#fbf6ee"/>
  </g>
</svg>
