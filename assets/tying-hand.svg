<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <!-- reaches left-to-right: sleeve at the left edge, fingertips toward the right edge -->
  <defs>
    <linearGradient id="sleeveFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c73b2b" stop-opacity="0"/>
      <stop offset="35%" stop-color="#c73b2b" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- sleeve -->
  <path d="M -20 55 C 20 40, 75 40, 112 60 C 124 66, 128 78, 122 90 L 108 118 C 98 132, 55 136, 15 124 C -12 116, -20 100, -20 55 Z"
        fill="url(#sleeveFade)"/>
  <path d="M 55 46 C 76 50, 94 58, 106 70" fill="none" stroke="#f2c14e" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 45 122 C 68 128, 90 124, 106 110" fill="none" stroke="#f2c14e" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <g stroke="#c68a5c" stroke-width="1.5">
    <!-- palm -->
    <ellipse cx="152" cy="94" rx="36" ry="28" fill="#d9a878" transform="rotate(-8 152 94)"/>

    <!-- thumb -->
    <g transform="translate(132,120) rotate(95)">
      <rect x="0" y="-9" width="38" height="18" rx="9" fill="#d9a878"/>
    </g>

    <!-- fingers, fanned out toward the upper-right -->
    <g transform="translate(174,70) rotate(-20)">
      <rect x="0" y="-8" width="60" height="16" rx="8" fill="#d9a878"/>
    </g>
    <g transform="translate(180,83) rotate(-6)">
      <rect x="0" y="-8.5" width="68" height="17" rx="8.5" fill="#d9a878"/>
    </g>
    <g transform="translate(178,96) rotate(9)">
      <rect x="0" y="-8" width="58" height="16" rx="8" fill="#d9a878"/>
    </g>
    <g transform="translate(170,109) rotate(24)">
      <rect x="0" y="-7" width="44" height="14" rx="7" fill="#d9a878"/>
    </g>
  </g>

  <!-- thread trailing from the middle fingertip toward where the rakhi sits -->
  <path d="M 248 77 C 268 74, 284 78, 296 86"
        fill="none" stroke="#cf9d3f" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 6"/>
</svg>
